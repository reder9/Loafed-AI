<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Subtle Warm Ground Shadow -->
  <ellipse cx="32" cy="56" rx="22" ry="4" fill="#ea580c" fill-opacity="0.16" />

  <!-- Bread Loaf Body with Integrated Cat Ears -->
  <path d="M 14 28
           C 11 21, 13 15, 17 10
           C 19.5 7, 23 11, 25 18
           C 27.5 17.2, 36.5 17.2, 39 18
           C 41 11, 44.5 7, 47 10
           C 51 15, 53 21, 50 28
           C 55 33, 56 43, 51 49
           C 47 54, 17 54, 13 49
           C 8 43, 9 33, 14 28 Z"
        fill="url(#tabbyLoafGrad)"
        stroke="#c2410c"
        stroke-width="2.5"
        stroke-linejoin="round" />

  <!-- Inner Ears (Warm Cream/Blush) -->
  <path d="M 18 12.5 C 19.5 11, 21.5 14, 22.5 18.5 C 20 19, 18 17, 18 12.5 Z" fill="#fff7ed" stroke="#ea580c" stroke-width="0.75" />
  <path d="M 46 12.5 C 44.5 11, 42.5 14, 41.5 18.5 C 44 19, 46 17, 46 12.5 Z" fill="#fff7ed" stroke="#ea580c" stroke-width="0.75" />

  <!-- Artisan Baker's Score Marks / Tabby Forehead Stripes -->
  <path d="M 28 23 C 30 26, 30 30, 28 33" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.9" />
  <path d="M 32 21 C 34 25, 34 31, 32 35" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.95" />
  <path d="M 36 23 C 38 26, 38 30, 36 33" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.9" />

  <!-- Cream White Undercarriage / Chest Muzzle Patch -->
  <path d="M 21 51 C 23 44, 41 44, 43 51 C 37 53, 27 53, 21 51 Z" fill="#fffdfa" />

  <!-- Sleek Tabby Muzzle Nose Dot & Whiskers (Minimal & modern) -->
  <circle cx="32" cy="39" r="1.5" fill="#c2410c" />
  <path d="M 26 40 Q 20 39, 16 41" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.8" />
  <path d="M 38 40 Q 44 39, 48 41" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Gradients -->
  <defs>
    <linearGradient id="tabbyLoafGrad" x1="16" y1="9" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="45%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
</svg>
